# 1. Build System (PEP 518) — Tells pip what backend builds the package
[build-system]
requires = ["hatchling"]  # Or ["setuptools>=61.0"], ["poetry-core"], ["flit_core"]
build-backend = "hatchling.build"

# 2. Project Metadata (PEP 621) — Package details and dependencies
[project]
name = "torch-omni-tool"
version = "0.1.1"
description = "Collection of pytorch tools and blocks"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Mateo Rodriguez", email = "mateodrr@gmail.com" }
]

# Core runtime dependencies
dependencies = [
    "torch",
    "torchvision",
    "wandb",
    "tqdm",
    "numpy",
    "pillow"
]

# Optional / extra dependencies (e.g. installed via `pip install .[dev]`)
[project.optional-dependencies]
# Only needed when Config.wb is enabled, imported lazily
dev = [
    "pytest",
    "pylint",
    "mypy",
    "black",
    "types-tqdm"
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-autorefs>=1.2",
]

# Project links shown on PyPI
[project.urls]
Homepage = "https://github.com/Mateo-drr/torch-omni-tool"
Repository = "https://github.com/Mateo-drr/torch-omni-tool.git"

# Wheel contents — explicit so all subpackages and py.typed ship in the dist
[tool.hatch.build.targets.wheel]
packages = ["torch_omni_tool"]

# 3. Tool Configurations — Specific tool settings consolidated in one place

[tool.pylint.main]
py-version = "3.12"
[tool.pylint.format]
max-line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["torch_omni_tool"]

[[tool.mypy.overrides]]
module = ["torch.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["torchvision.*"]
ignore_missing_imports = true
